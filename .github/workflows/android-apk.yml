# Sestaví testovací Android APK a zveřejní ho jako release "test-build":
#   https://github.com/<owner>/<repo>/releases/tag/test-build
#
# APK je podepsané standardním debug klíčem z Expo šablony
# (SHA-1 5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25) — ten je
# potřeba zaregistrovat u Android OAuth klienta v Google Cloud, aby fungovalo
# přihlášení Googlem. Jen pro testování, ne pro Google Play.
name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk uctenkomat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: uctenkomat-apk
          path: mobile/uctenkomat.apk

      - name: Publish as "test-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build uctenkomat.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Účtenkomat – testovací build" \
            --notes "Větev ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Stáhněte uctenkomat.apk v telefonu a nainstalujte."
