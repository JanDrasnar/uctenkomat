# Produkční build pro Google Play: podepsaný App Bundle (.aab) vlastním
# upload klíčem. Spouští se ručně (Actions → Android release → Run workflow).
#
# Potřebné secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64   keystore (.jks) zakódovaný v base64
#   UPLOAD_KEYSTORE_PASSWORD heslo keystore
#   UPLOAD_KEY_ALIAS         alias klíče (např. upload)
#   UPLOAD_KEY_PASSWORD      heslo klíče
#
# versionCode = číslo běhu tohoto workflow (Google Play vyžaduje, aby rostlo).
name: Android release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -z "$KS_PASS" ] && missing="$missing UPLOAD_KEYSTORE_PASSWORD"
          [ -z "$ALIAS" ] && missing="$missing UPLOAD_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Chybí secrets:$missing — viz docs/vydani-google-play.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Decode upload keystore
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Generate native Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build signed App Bundle
        working-directory: mobile/android
        env:
          UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Collect bundle and signing fingerprint
        env:
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab "uctenkomat-${{ github.run_number }}.aab"
          sha1=$(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -alias "$ALIAS" | grep 'SHA1:' | awk '{print $2}')
          {
            echo "### Účtenkomat – release build ${{ github.run_number }}"
            echo ""
            echo "- Soubor: \`uctenkomat-${{ github.run_number }}.aab\` (artefakt níže) → nahrát do Google Play Console"
            echo "- versionCode: ${{ github.run_number }}"
            echo "- SHA-1 upload klíče: \`$sha1\` (zaregistrovat u Android OAuth klienta v Google Cloud)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: uctenkomat-aab-${{ github.run_number }}
          path: mobile/uctenkomat-${{ github.run_number }}.aab
